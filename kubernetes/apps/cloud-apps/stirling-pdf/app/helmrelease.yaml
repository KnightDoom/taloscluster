---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      stirling-pdf:
        containers:
          app:
            image:
              repository: ghcr.io/stirling-tools/stirling-pdf
              tag: 3.3.0@sha256:ed7b1775c6706b5e5ea24fa6155f078eff1027bd35a17d21834e4407036025e6
            env:
              TZ: America/New_York
              SECURITY_ENABLELOGIN: "true"
              portNum: &port 8080
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 60
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 300Mi
              limits:
                memory: 4Gi
                gpu.intel.com/i915: 1        # CHANGE ME if your node advertises gpu.intel.com/xe

    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: stirling-pdf
        ports:
          http:
            port: *port
    ingress:
      app:
        className: internal
        hosts:
          - host: pdf.${SECRET_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
    persistence:
      config:
        existingClaim: stirling-pdf-config
        globalMounts:
          - path: /configs
      storage:
        type: emptyDir
        globalMounts:
          - path: /storage
      logs:
        type: emptyDir
        globalMounts:
          - path: /logs
      custom-files:
        type: emptyDir
        globalMounts:
          - path: /customFiles
      pipeline:
        type: emptyDir
        globalMounts:
          - path: /pipeline
      tessdata:
        type: emptyDir
        globalMounts:
          - path: /usr/share/tessdata
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
