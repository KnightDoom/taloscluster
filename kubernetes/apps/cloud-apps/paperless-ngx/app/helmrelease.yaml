---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      paperless:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.3.4@sha256:9bc6e8248891bcfa6f52fffe8b81e4ea8cae75790c3ec1b9906961a7ba55c969
            env:
              PAPERLESS_REDIS: redis://dragonfly.database.svc.cluster.local:6379
              PAPERLESS_URL: "https://paperless.${SECRET_DOMAIN}"
              PAPERLESS_TIME_ZONE: America/New_York
              USERMAP_UID: "1000"
              USERMAP_GID: "1000"
              portNum: &port 8000
              TZ: America/New_York
            envFrom:
              - secretRef:
                  name: paperless-db-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 4Gi
    service:
      app:
        controller: paperless
        ports:
          http:
            port: *port
    ingress:
      app:
        className: internal
        #annotations:
        #  external-dns.kubernetes.io/target: external.${SECRET_DOMAIN}
        hosts:
          - host: paperless.${SECRET_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
    persistence:
      data:
        existingClaim: paperlessng
        globalMounts:
          - path: /usr/src/paperless/data
      media:
        type: nfs
        server: 192.168.86.9
        path: /BackedStorage/docs
        globalMounts:
          - path: /usr/src/paperless/media
      consume:
        type: emptyDir
        globalMounts:
          - path: /usr/src/paperless/consume
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
